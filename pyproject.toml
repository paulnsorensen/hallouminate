[project]
name = "hallouminate-behavior-tests"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pytest==9.0.3",
    "pytest-bdd==8.1.0",
    "pytest-xdist==3.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/bdd"]
addopts = "--strict-config --strict-markers"
