name: Ground retrieval evaluation

on:
  schedule:
    - cron: "17 7 * * 1" # weekly, separate from release nightly
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          enforce compares against the committed baseline; measure runs both
          arms and uploads the artifact for a baseline update.
        type: choice
        options:
          - enforce
          - measure
        default: enforce

concurrency:
  group: eval-${{ github.ref }}-${{ inputs.mode || 'enforce' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  eval:
    name: ground retrieval evaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup show

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install ripgrep
        # `rg` is a hard runtime dependency of the lexical search pass
        # (crates/hallouminate-domain/src/search/ripgrep.rs); the ubuntu-24.04
        # hosted image doesn't ship it. Mirrors ci.yml's Linux install step.
        run: sudo apt-get update && sudo apt-get install -y ripgrep && rg --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: eval

      - name: Cache evaluation model downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/hallouminate/fastembed
            ~/.cache/huggingface
          key: eval-models-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'eval/queries.json', 'eval/fixtures/wiki/**') }}
          restore-keys: |
            eval-models-${{ runner.os }}-

      - name: Enforce ground retrieval baseline
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'measure'
        run: just eval

      - name: Measure ground retrieval artifact
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'measure'
        run: just eval-measure

      - name: Upload measurement artifact
        # !cancelled(): always() also fired on cancellation, which is routine
        # under cancel-in-progress; !cancelled() keeps the partial-artifact
        # upload after a diagnostic-arm failure without that.
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'measure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-measurement
          path: .context/issue-288-eval-results.json
          if-no-files-found: error
