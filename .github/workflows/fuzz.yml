name: Fuzz

# cargo-fuzz targets for the hallouminate-domain markdown parsers (fuzz/).
#
# - build: a PR that touches the parsers or the fuzz crate builds every target
#   and replays the seeds and the newest daily corpus once. The harness cannot
#   rot, and a PR never fails on a random new input.
# - fuzz: a daily run fuzzes each target on all runner cores from the newest
#   fuzz-corpus-<target> artifact, then uploads the minimized corpus as a new
#   artifact and crash inputs as fuzz-crash-<target>.
# - report: a failed daily leg opens or updates one issue per target.
#
# The corpus is an artifact, not an Actions cache entry: the repository cache
# is at its size limit, so LRU eviction removes a daily cache entry before the
# next run.
#
# The fuzz crate is its own workspace on the nightly in fuzz/rust-toolchain.toml.
# Each job copies the root Cargo.lock into fuzz/ so the targets fuzz the same
# dependency versions that ship.

on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/hallouminate-domain/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzzing time per target, in seconds
        default: "1200"

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  build:
    name: build and replay corpus
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # download the corpus artifact
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Use the shipped lockfile
        run: cp ../Cargo.lock Cargo.lock
      - run: cargo fmt --check
      - name: Build all targets
        run: cargo fuzz build --debug-assertions
      # Best effort: a fork PR or an API error replays the seeds only.
      - name: Restore daily corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for target in $(cargo fuzz list); do
            ci/corpus-artifact.sh fetch "$target" "corpus/$target" \
              || echo "::warning::cannot restore the corpus for $target"
          done
      - name: Replay seeds and corpus
        run: |
          set -euo pipefail
          for target in $(cargo fuzz list); do
            dirs=(seeds ../.hallouminate/wiki)
            [[ -d "corpus/$target" ]] && dirs+=("corpus/$target")
            cargo fuzz run --debug-assertions "$target" "${dirs[@]}" -- \
              -runs=0 -timeout=10 -rss_limit_mb=2048
          done

  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # download the corpus artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: claim_marks
            max_len: 32768
          - target: frontmatter
            max_len: 32768
          - target: footnotes
            max_len: 32768
          # Small budgets make many chunks; shorter inputs keep exec/s useful.
          - target: chunker
            max_len: 8192
          - target: rst_chunker
            max_len: 8192
          - target: section_edit
            max_len: 32768
          - target: relative_path
            max_len: 4096
          - target: wikilinks
            max_len: 32768
          - target: text_helpers
            max_len: 32768
    defaults:
      run:
        working-directory: fuzz
    env:
      TARGET: ${{ matrix.target }}
      MAX_LEN: ${{ matrix.max_len }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || '1200' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned nightly
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - name: Use the shipped lockfile
        run: cp ../Cargo.lock Cargo.lock
      - name: Restore corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/corpus-artifact.sh fetch "$TARGET" "corpus/$TARGET"
      - name: Build target
        run: cargo fuzz build --debug-assertions "$TARGET"
      # --jobs N runs libFuzzer with -fork=N. New inputs go to the first corpus
      # dir. Fork mode ignores timeouts and OOMs, so check the artifact dir.
      - name: Fuzz
        id: fuzz
        run: |
          set -euo pipefail
          mkdir -p "corpus/$TARGET"
          cargo fuzz run --debug-assertions --jobs "$(nproc)" "$TARGET" "corpus/$TARGET" seeds ../.hallouminate/wiki -- \
            -dict=markdown.dict \
            -max_len="$MAX_LEN" \
            -max_total_time="$SECONDS_PER_TARGET" \
            -timeout=10 \
            -rss_limit_mb=2048 \
            -print_final_stats=1
          ci/check-artifacts.sh "artifacts/$TARGET"
      # cargo-fuzz 0.13.2 cmin prints "Failed to minimize corpus" when
      # libFuzzer fails, keeps the old corpus, and still exits 0.
      - name: Minimize corpus
        if: ${{ !cancelled() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure') }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          log=$(mktemp)
          cargo fuzz cmin --debug-assertions "$TARGET" "corpus/$TARGET" -- \
            -max_len="$MAX_LEN" \
            -timeout=10 \
            -rss_limit_mb=2048 2>&1 | tee "$log"
          ci/check-artifacts.sh "artifacts/$TARGET"
          if grep -q '^Failed to minimize corpus' "$log"; then
            echo "::error::cargo fuzz cmin failed; the corpus is not minimized"
            exit 1
          fi
      # Upload also after a crash, so the next run keeps this run's coverage.
      - name: Upload corpus
        if: ${{ !cancelled() && (steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  # A separate job keeps issues: write away from the jobs that compile and
  # run third-party crates.
  report:
    name: file failure issues
    needs: fuzz
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fuzz-report
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # list the jobs of this run
      issues: write # open or comment on the issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: fuzz/ci
      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: fuzz/ci/report-failures.sh
