[book]
title = "hallouminate"
description = "Persistent, repo-local knowledge for coding agents."
authors = ["Paul Sorensen"]
language = "en"
src = "src"

[output.html]
default-theme = "rust"
preferred-dark-theme = "ayu"
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/paulnsorensen/hallouminate"
edit-url-template = "https://github.com/paulnsorensen/hallouminate/edit/main/docs/{path}"
site-url = "/hallouminate/"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
