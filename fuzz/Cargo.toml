[package]
name = "hallouminate-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Own workspace: the root `just verify` gate never builds libFuzzer, and the
# nightly toolchain pinned in rust-toolchain.toml applies only here.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
hallouminate-domain = { path = "../crates/hallouminate-domain" }
# Same major as hallouminate-domain so `Characters` implements the
# re-exported `ChunkSizer` trait.
text-splitter = "0.33"
# Same versions as hallouminate-domain: the format_handlers oracle decodes
# claim-mark JSON and counts PDF pages with the parsers the handlers use.
serde_json = "1"
pdf-extract = "0.12"

[[bin]]
name = "claim_marks"
path = "fuzz_targets/claim_marks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frontmatter"
path = "fuzz_targets/frontmatter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "footnotes"
path = "fuzz_targets/footnotes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunker"
path = "fuzz_targets/chunker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rst_chunker"
path = "fuzz_targets/rst_chunker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "section_edit"
path = "fuzz_targets/section_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "relative_path"
path = "fuzz_targets/relative_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wikilinks"
path = "fuzz_targets/wikilinks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_helpers"
path = "fuzz_targets/text_helpers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_handlers"
path = "fuzz_targets/format_handlers.rs"
test = false
